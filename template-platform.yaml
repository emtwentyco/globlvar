variables:
  - key: PLATFORM_NAME
    value: globlvar-platform
  - key: PLATFORM_NAMESPACE
    value: platform-services
  - key: PLATFORM_REPLICA_COUNT
    value: "3"
  - key: PLATFORM_HEALTHCHECK_PATH
    value: /healthz
  - key: PLATFORM_METRICS_PATH
    value: /metrics
