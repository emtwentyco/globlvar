name: Global Variable Groups

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - globalvariables.yaml
      - template-purchase.yaml
      - template-platform.yaml
      - .github/workflows/variable-groups.yml

permissions:
  id-token: write
  contents: read

jobs:
  inject-and-print:
    runs-on: ubuntu-latest
    env:
      PLATFORM_NAME: emtwenty
      APP_NAME: scumlapp
    permissions:
      contents: read
    steps:
      - name: Inject variable groups
        uses: lindluni/actions-variable-groups@main
        with:
          org: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          groups: |
            globalvariables.yaml
            template-purchase.yaml
            template-platform.yaml
      
      - name: Print variables
        run: env | sort

      - name: Use a variable
        run: echo "$PLATFORM_NAME"-"$APP_NAME"

  OIDC:
    name: Azure OIDC
    runs-on: ubuntu-latest
    steps:
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show
            # You can write your Azure CLI inline scripts here.
